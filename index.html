<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OPT Flipper</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">
  <link rel="stylesheet" href="src/styles/main.css?v=2.3">
  <link rel="stylesheet" href="src/styles/hud.css?v=2.3">
  <link rel="stylesheet" href="src/styles/screens.css?v=2.3">
  <link rel="stylesheet" href="src/styles/panels.css?v=2.3">
  <link rel="stylesheet" href="src/styles/mobile.css?v=2.3">
  <link rel="stylesheet" href="src/styles/shop.css?v=1.0">
  <link rel="stylesheet" href="src/styles/development.css?v=1.0">
  <link rel="stylesheet" href="src/styles/icons.css?v=1.0">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "tweakpane": "https://unpkg.com/tweakpane@4.0.5/dist/tweakpane.min.js",
        "animejs": "./src/libs/animeWrapper.js"
      }
    }
  </script>
</head>
<body>
  <!-- Atmospheric Morphing Organic CSS Background -->
  <div id="ambient-background" aria-hidden="true">
    <div class="ambient-blob ambient-blob-1"></div>
    <div class="ambient-blob ambient-blob-2"></div>
    <div class="ambient-blob ambient-blob-3"></div>
    <div class="ambient-blob ambient-blob-4"></div>
    <div class="ambient-blob ambient-blob-5"></div>
    <div class="ambient-overlay"></div>
  </div>

  <div id="game-container"></div>
  <div id="vignette"></div>
  <div id="ui-overlay">
    <div id="hud"></div>
    <div id="screens"></div>
    <div id="landscape-notice" class="landscape-notice" style="display:none;">
      <div class="landscape-notice-box">
        <div class="landscape-notice-icon"><span class="atlas-icon icon-phone"></span> <span class="atlas-icon icon-rotate"></span></div>
        <div class="landscape-notice-title">Obróć telefon do pionu</div>
        <div class="landscape-notice-sub">Gra działa w trybie pionowym z kontrolą żyroskopu.</div>
        <button id="landscape-lock-btn" class="landscape-lock-btn" type="button"><span class="atlas-icon icon-phone"></span> Zablokuj pion w pełnym ekranie</button>
      </div>
    </div>
  </div>
  <div id="label-container"></div>
  <div id="panels"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
